<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Campus Assistant | CampusConnect</title><link rel="stylesheet" href="style.css"></head><body class="app-shell"><div id="app-nav"></div><main class="page-wrap narrow"><div class="page-heading"><div><p class="eyebrow">CAMPUS AI ASSISTANT</p><h1>What are you working on?</h1><p class="lede">A lightweight guide for your next campus move.</p></div></div><section class="panel" id="chat"><div class="activity-list"><div><b>Campus Assistant</b><span>Try asking for project ideas, teammates, hackathons, internships, skills or interview prep.</span></div></div><div class="tag-list"><button class="button outline" onclick="ask('Suggest project ideas')">Project ideas</button><button class="button outline" onclick="ask('Find teammates')">Find teammates</button><button class="button outline" onclick="ask('Help me prepare for an interview')">Interview prep</button></div><form id="chatForm"><input id="prompt" placeholder="Ask your campus assistant..." required><button class="button" type="submit">Ask</button></form></section></main><script src="app.js"></script><script src="nav.js"></script><script>const responses={project:'Try a study planner for your department, a campus navigation tool, or a peer skill-swap platform.',teammate:'Start with teammates.html and search by the skill your idea needs most. A clear brief gets better replies.',hackathon:'Look for events whose problem statement interests you, then build a small team with one builder, one designer and one storyteller.',internship:'Filter opportunities by your course and deadline, then save two roles and tailor your portfolio to each.',skill:'Learn one practical skill that compounds with your current strengths: Git, APIs, testing or presenting.',interview:'Prepare three project stories using context, your contribution, the tradeoff and the result.'};function ask(text){prompt.value=text;chatForm.requestSubmit();}chatForm.addEventListener('submit',e=>{e.preventDefault();const text=prompt.value.toLowerCase();const key=Object.keys(responses).find(k=>text.includes(k))||'skill';chat.insertAdjacentHTML('beforeend',`<div class="activity-list"><div><b>You</b><span>${prompt.value}</span></div><div><b>Campus Assistant</b><span>${responses[key]}</span></div></div>`);prompt.value='';});</script></body></html>
