<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hackathons | CampusConnect</title><link rel="stylesheet" href="style.css"></head><body class="app-shell"><div id="app-nav"></div><main class="page-wrap"><div class="page-heading"><div><p class="eyebrow">BUILD TOGETHER</p><h1>Hackathons</h1><p class="lede">Find a challenge, meet your team and make something useful.</p></div></div><section class="cards" id="hackathonList"><div class="panel"><h2>Loading hackathons...</h2></div></section></main><script src="app.js"></script><script src="nav.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{try{const data=await api('/hackathons');hackathonList.innerHTML=data.hackathons.map(h=>`<article class="card"><span class="eyebrow">${h.date||'UPCOMING'}</span><h2>${h.name}</h2><p>${h.description||'Bring your curiosity and build with other students.'}</p><p><b>${h.location||'Campus'}</b> · ${h.members?.length||0}/${h.teamSize||5} members</p><button class="button" onclick="joinHackathon('${h._id}')">Request to join</button></article>`).join('')||'<div class="panel"><h2>No hackathons posted yet.</h2></div>';}catch(error){hackathonList.innerHTML='<div class="panel"><h2>Log in to browse hackathons.</h2></div>';}});async function joinHackathon(id){try{await api('/hackathons/'+id+'/join',{method:'POST'});alert('You joined the hackathon team.');location.reload();}catch(error){alert(error.message);}}</script></body></html>
