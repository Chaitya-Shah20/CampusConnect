<!DOCTYPE html>
<html>

<head>

    <title>CampusConnect - Create Account</title>

    <link rel="stylesheet" href="style.css">

    <style>
        body {

            min-height: 100vh;

            background-image:

                linear-gradient(rgba(0, 0, 0, 0.70),
                    rgba(0, 0, 0, 0.70)),

                url("https://images.unsplash.com/photo-1523240795612-9a054b0db644?auto=format&fit=crop&w=1600&q=80");

            background-size: cover;

            background-position: center;

        }
    </style>

</head>


<body>


    <div class="box center">

        <h1>CampusConnect</h1>

        <p class="message">
            Connect. Collaborate. Grow.
        </p>


        <h2>Create Your Account</h2>

        <p class="message">
            Join your campus community today.
        </p>


        <form id="registerForm">


            <label>Full Name</label>

            <input type="text" id="name" placeholder="Enter your full name" required>


            <label>Email</label>

            <input type="email" id="email" placeholder="Enter your email" required>


            <label>Password</label>

            <input type="password" id="password" placeholder="Create a password" required>


            <label>College / University</label>
            <input type="text" id="college" placeholder="Your college or university" required>

            <label>Course</label>

            <select id="course" required>

                <option value="">
                    Select your course
                </option>

                <option>B.Tech</option>

                <option>BCA</option>

                <option>BBA</option>

                <option>MCA</option>

                <option>M.Tech</option>

                <option>Other</option>

            </select>


            <label>Year</label>

            <select id="year" required>

                <option value="">
                    Select your year
                </option>

                <option>1st Year</option>

                <option>2nd Year</option>

                <option>3rd Year</option>

                <option>4th Year</option>

            </select>

            <label>Skills</label>
            <input type="text" id="skills" placeholder="Python, Web Development, UI/UX">

            <label>Interests</label>
            <input type="text" id="interests" placeholder="Startups, music, sustainability">

            <p class="message" data-message></p>


            <button type="submit" class="button">

                Create Account

            </button>


        </form>


        <p>

            Already have an account?

            <a href="login.html">
                <b>Login</b>
            </a>

        </p>


        <a href="index.html">

            ← Back to Home

        </a>


    </div>


    <script src="app.js"></script>
    <script>

        document
            .getElementById("registerForm")
            .addEventListener("submit", async function (event) {

                event.preventDefault();


                var name =
                    document.getElementById("name").value;


                var email =
                    document.getElementById("email").value;


                var course = document.getElementById("course").value;
                var year = document.getElementById("year").value;
                var college = document.getElementById("college").value;
                try {
                    await api('/auth/register', { method:'POST', body:JSON.stringify({name,email,password:document.getElementById('password').value,college,course,year,skills:document.getElementById('skills').value,interests:document.getElementById('interests').value}) });
                    window.location.href = 'dashboard.html';
                } catch (error) { showMessage(error.message, 'error'); }

            });

    </script>


</body>

</html>
