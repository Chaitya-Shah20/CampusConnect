<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Resources | CampusConnect</title><link rel="stylesheet" href="style.css"></head><body class="app-shell"><div id="app-nav"></div><main class="page-wrap"><div class="page-heading"><div><p class="eyebrow">SHARED KNOWLEDGE</p><h1>Campus resources</h1><p class="lede">Notes, papers and links shared by students.</p></div><button class="button" onclick="document.getElementById('resourceForm').hidden=false">Upload resource</button></div><form class="panel form-panel inline-form" id="resourceForm" hidden><label>Title<input id="resourceTitle" required></label><label>Subject<input id="resourceSubject" required></label><label>Category<select id="resourceCategory"><option>Notes</option><option>Study Material</option><option>Previous Papers</option><option>Tutorials</option><option>Useful Links</option></select></label><label>Link<input id="resourceUrl" type="url" placeholder="https://..."></label><button class="button" type="submit">Publish</button><p data-message></p></form><section class="cards resource-grid" id="resourceList"><div class="panel"><h2>Loading resources...</h2></div></section></main><script src="app.js"></script><script src="nav.js"></script><script>document.addEventListener('DOMContentLoaded', async()=>{const list=document.getElementById('resourceList');try{const data=await api('/resources');list.innerHTML=data.resources.map(r=>`<article class="resource-card"><span class="eyebrow">${r.category||'RESOURCE'}</span><h2>${r.title}</h2><p>${r.subject}</p><small>Shared by ${r.uploadedBy?.name||'student'}</small><a class="text-link" href="${r.url||'#'}" target="_blank">Download resource ↗</a></article>`).join('')||'<div class="panel"><h2>No resources yet</h2></div>';}catch(e){list.innerHTML='<div class="panel"><h2>Log in to view resources.</h2></div>';} resourceForm.addEventListener('submit',async e=>{e.preventDefault();try{await api('/resources',{method:'POST',body:JSON.stringify({title:resourceTitle.value,subject:resourceSubject.value,category:resourceCategory.value,url:resourceUrl.value})});location.reload();}catch(error){showMessage(error.message,'error');}});});</script></body></html>
