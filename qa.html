<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Campus Q&A | CampusConnect</title><link rel="stylesheet" href="style.css"></head><body class="app-shell"><div id="app-nav"></div><main class="page-wrap"><div class="page-heading"><div><p class="eyebrow">ASK THE CAMPUS</p><h1>Campus Q&A</h1><p class="lede">Practical answers from people who have been there.</p></div><button class="button" onclick="document.getElementById('questionForm').hidden=false">Ask a question</button></div><form class="panel form-panel" id="questionForm" hidden><h2>Start a conversation</h2><label>Question title<input id="questionTitle" required></label><label>Category<select id="questionCategory"><option>Academics</option><option>Projects</option><option>Hackathons</option><option>Campus Life</option><option>Career</option><option>Technology</option></select></label><label>Description<textarea id="questionDescription" rows="4" required></textarea></label><button class="button" type="submit">Post question</button><p data-message></p></form><section class="cards" id="questionList"><div class="panel"><h2>Loading questions...</h2></div></section></main><script src="app.js"></script><script src="nav.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{try{const data=await api('/questions');questionList.innerHTML=data.questions.map(q=>`<article class="card"><span class="eyebrow">${q.category}</span><h2>${q.title}</h2><p>${q.description}</p><small>Asked by ${q.author?.name||'student'}</small></article>`).join('')||'<div class="panel"><h2>Be the first to ask.</h2></div>';}catch(e){questionList.innerHTML='<div class="panel"><h2>Log in to join Q&A.</h2></div>';}});questionForm.addEventListener('submit',async e=>{e.preventDefault();try{await api('/questions',{method:'POST',body:JSON.stringify({title:questionTitle.value,category:questionCategory.value,description:questionDescription.value})});location.reload();}catch(error){showMessage(error.message,'error');}});</script></body></html>
