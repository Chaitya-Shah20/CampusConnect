<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile | CampusConnect</title><link rel="stylesheet" href="style.css"></head><body class="app-shell"><div id="app-nav"></div><main class="page-wrap narrow"><div class="page-heading"><div><p class="eyebrow">YOUR PROFILE</p><h1>Make your work discoverable.</h1></div></div><section class="profile-layout"><div class="profile-card"><div class="avatar large" data-avatar>CC</div><h2 data-profile-name>Student</h2><p data-profile-course>Course</p><div class="tag-list" data-profile-skills></div><a class="button" href="#edit">Edit profile</a></div><form class="panel form-panel" id="profileForm"><h2>Profile details</h2><label>Full name<input id="profileName" required></label><label>College / University<input id="profileCollege" required></label><label>Course<input id="profileCourse" required></label><label>Year<input id="profileYear" required></label><label>Skills<input id="profileSkills" placeholder="Python, UI/UX, Web Development"></label><label>Interests<input id="profileInterests" placeholder="Startups, climate, design"></label><button class="button" type="submit">Save changes</button><p data-message></p></form></section></main><script src="app.js"></script><script src="nav.js"></script><script>document.addEventListener('DOMContentLoaded', async () => { const user = await loadUser(); if (!user) return; profileName.value=user.name; profileCollege.value=user.college; profileCourse.value=user.course; profileYear.value=user.year; profileSkills.value=user.skills.join(', '); profileInterests.value=user.interests.join(', '); profileForm.addEventListener('submit', async e => { e.preventDefault(); try { const data=await api('/users/me',{method:'PUT',body:JSON.stringify({name:profileName.value,college:profileCollege.value,course:profileCourse.value,year:profileYear.value,skills:profileSkills.value,interests:profileInterests.value})}); showMessage('Profile updated successfully.','success'); document.querySelector('[data-profile-name]').textContent=data.user.name; } catch(error) { showMessage(error.message,'error'); } }); });</script></body></html>
